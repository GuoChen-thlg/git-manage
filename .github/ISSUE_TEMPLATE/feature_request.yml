name: 功能建议
description: 提出新功能或改进想法
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 当前缺少什么能力？你的使用场景是什么？
      placeholder: 例如：我希望能在提交图上直接对比任意两个提交……
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望如何使用这个功能？
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 是否考虑过其他做法？效果如何？

  - type: textarea
    id: context
    attributes:
      label: 补充上下文（可选）
      description: 截图、参考实现（如 IntelliJ IDEA 的对应交互）等
