name: Bug 反馈
description: 报告一个缺陷，帮助我们改进
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢反馈！请尽量完整地填写以下信息，便于快速定位问题。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？与预期行为有何不同？
      placeholder: 清晰描述问题现象
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序列出触发问题的操作
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察到……
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 正常情况下应该是什么结果？
    validations:
      required: true

  - type: input
    id: env
    attributes:
      label: 运行环境
      description: 宿主平台与版本（如 OpenChamber / VSCode 版本）、操作系统
      placeholder: OpenChamber x.y.z / macOS 15
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志或截图（可选）
      description: 相关报错日志、控制台输出或界面截图

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有重复反馈
          required: true
