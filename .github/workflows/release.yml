name: Release

# 仅在主分支（dev）上发布：打 tag 或手动触发都必须来自主分支
# 功能分支禁止发布，构建前先校验 ref
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 发布门禁：tag 或触发分支必须指向主分支 dev，否则直接失败
      - name: 校验发布来源为主分支
        run: |
          MAIN_BRANCH="main"
          # 判断当前 ref 是否可从主分支到达：tag 必须落在 dev 上，手动触发必须选 dev
          git fetch origin "$MAIN_BRANCH" --depth=1
          if ! git merge-base --is-ancestor HEAD "origin/$MAIN_BRANCH"; then
            echo "::error::发布仅允许来自主分支 $MAIN_BRANCH，当前提交不在该分支历史中"
            exit 1
          fi
          echo "发布来源校验通过：$GITHUB_REF 属于 $MAIN_BRANCH"

      # pnpm 版本取自根 package.json 的 packageManager 字段
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # service 入口引用 core 的构建产物，需先构建全部包
      - name: 构建
        run: pnpm build

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm exec vitest run

      - name: 打包扩展 zip
        run: pnpm --filter git-manager run pack

      - name: 打包 VS Code 扩展 vsix
        run: pnpm --filter git-manager-vscode run package

      - name: 上传构建制品
        uses: actions/upload-artifact@v4
        with:
          name: git-manager-extension
          path: |
            packages/openchamber/release/*.zip
            packages/vscode/*.vsix
          if-no-files-found: error

      # 把构建产物推到 release 分支，供「从 Git URL 安装」使用
      # 只保留运行时文件：package.json + dist/，其余清空
      # tag 与 main 推送都要同步：发布实际走 tag，只判 main 会导致 tag 发布时产物不更新
      # 安全性由前置的「发布来源校验」保证：tag 必须可从 main 到达，功能分支无法通过
      - name: 同步产物到 release 分支
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          STAGE=$(mktemp -d)
          cp packages/openchamber/package.json "$STAGE/package.json"
          cp -R packages/openchamber/dist "$STAGE/dist"

          cd "$STAGE"
          git init -q -b release
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "chore: 发布构建产物 ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" release

      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/openchamber/release/*.zip
            packages/vscode/*.vsix
          generate_release_notes: true
