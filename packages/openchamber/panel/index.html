<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      /* 中性 reset：主题色与字体交由 styles.css 的 --gm-* 变量接管，
         避免与宿主注入的 --oc-* 主题变量冲突 */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      * { box-sizing: border-box; }
    </style>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script src="main.js"></script>
  </body>
</html>
